<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyVault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOCK SCREEN -->

<main id="lockScreen">

  <div class="lock-card">

    <div class="lock-logo">🔐</div>

    <h1>KeyVault</h1>

    <p class="subtitle">Secure API key manager</p>

    <div class="locked-badge">🔒 VAULT LOCKED</div>

    <label>Enter password</label>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
    >

    <p id="error"></p>

    <button id="unlockButton">
      Unlock Vault
    </button>

  </div>

</main>


<!-- MAIN APP -->

<main id="app">

  <header>

    <div class="brand">

      <div class="brand-icon">🔐</div>

      <div>
        <h2>KeyVault</h2>
        <span>API KEY MANAGER</span>
      </div>

    </div>

    <button id="lockButton" class="icon-button">
      🔒
    </button>

  </header>


  <section class="welcome">

    <span class="eyebrow">SECURE VAULT</span>

    <h1>Your API keys</h1>

    <p>Manage all your AI credentials in one place.</p>

  </section>


  <!-- SEARCH -->

  <div class="search-area">

    <span>⌕</span>

    <input
      id="searchInput"
      type="text"
      placeholder="Search keys or providers..."
    >

    <button id="addButton">＋</button>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button class="filter active">
      All <b>0</b>
    </button>

    <button class="filter">
      Valid <b>0</b>
    </button>

    <button class="filter">
      Needs Check <b>0</b>
    </button>

    <button class="filter">
      Low Balance <b>0</b>
    </button>

    <button class="filter">
      Invalid <b>0</b>
    </button>

  </div>


  <!-- ADD API -->

  <section id="addPanel" class="add-panel">

    <div class="panel-header">

      <div>
        <span class="eyebrow">NEW CREDENTIAL</span>
        <h2>Add API Key</h2>
      </div>

      <button id="closeAddButton">✕</button>

    </div>


    <label>Provider</label>

    <input
      id="providerInput"
      type="text"
      placeholder="e.g. OpenAI"
    >


    <label>API name</label>

    <input
      id="nameInput"
      type="text"
      placeholder="e.g. My OpenAI"
    >


    <label>API key</label>

    <input
      id="apiInput"
      type="password"
      placeholder="Enter test API key"
    >


    <button id="saveButton" class="primary-button">
      💾 Save API Key
    </button>

  </section>


  <!-- API LIST -->

  <section id="keyList">

    <div class="empty-state">

      <div class="key-symbol">🔑</div>

      <h2>No API keys yet</h2>

      <p>Add your first API key using the ＋ button.</p>

      <button id="emptyAddButton" class="primary-button">
        ＋ Add API Key
      </button>

    </div>

  </section>


  <!-- NAVIGATION -->

  <nav>

    <button class="nav-active">
      🔑
      <span>Keys</span>
    </button>

    <button>
      📊
      <span>Usage</span>
    </button>

    <button>
      ⚙️
      <span>Settings</span>
    </button>

  </nav>

</main>


<script src="script.js"></script>

</body>
</html>
