<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KeyVault</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>


<!-- =========================
     LOCK SCREEN
========================= -->

<div id="lockScreen">

  <div class="lockBox">

    <div class="lockIcon">🔐</div>

    <h1>KeyVault</h1>

    <p>Secure API Key Manager</p>

    <div class="locked">
      🔒 VAULT LOCKED
    </div>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="Enter password"
    >

    <div id="error"></div>

    <button id="unlockButton">
      Unlock Vault
    </button>

  </div>

</div>



<!-- =========================
     MAIN APP
========================= -->

<div id="app">


  <!-- HEADER -->

  <header>

    <div class="logoArea">

      <div class="logo">
        🔑
      </div>

      <div>

        <h2>KeyVault</h2>

        <small>
          API KEY MANAGER
        </small>

      </div>

    </div>


    <button
      id="lockButton"
      class="lockButton">

      🔒

    </button>

  </header>



  <!-- TITLE -->

  <section class="titleArea">

    <small>
      SECURE VAULT
    </small>

    <h1>
      Your API keys
    </h1>

    <p>
      Manage all your AI credentials in one place.
    </p>

  </section>



  <!-- SEARCH -->

  <div class="searchBox">

    <span>⌕</span>

    <input
      id="searchInput"
      type="text"
      placeholder="Search keys, providers, notes"
    >

    <button id="addButton">
      ＋
    </button>

  </div>



  <!-- FILTERS -->

  <div class="filters">

    <button class="filter active">
      All <b id="allCount">0</b>
    </button>

    <button class="filter">
      Valid 0
    </button>

    <button class="filter">
      Needs Check 0
    </button>

    <button class="filter">
      Low Balance 0
    </button>

    <button class="filter">
      Invalid 0
    </button>

  </div>



  <!-- =========================
       ADD API PANEL
  ========================= -->

  <div id="addPanel">

    <div class="panelTop">

      <div>

        <small>
          NEW CREDENTIAL
        </small>

        <h2>
          Add API Key
        </h2>

      </div>


      <button id="closeAdd">
        ✕
      </button>

    </div>


    <label>
      Provider
    </label>

    <input
      id="providerInput"
      type="text"
      placeholder="e.g. OpenAI"
    >


    <label>
      API name
    </label>

    <input
      id="nameInput"
      type="text"
      placeholder="e.g. OpenAI Production"
    >


    <label>
      API key
    </label>

    <input
      id="apiInput"
      type="password"
      placeholder="Enter API key"
    >


    <label>
      USD Balance
    </label>

    <input
      id="balanceInput"
      type="number"
      step="0.01"
      placeholder="e.g. 18.42"
    >


    <button
      type="button"
      class="saveButton"
      onclick="saveKey()">

      💾 Save API Key

    </button>

  </div>



  <!-- =========================
       API KEY LIST
  ========================= -->

  <div id="keyList">

    <div class="empty">

      <div class="bigKey">
        🔑
      </div>

      <h2>
        No API keys yet
      </h2>

      <p>
        Add your first API key using the ＋ button.
      </p>

    </div>

  </div>



  <!-- =========================
       BOTTOM NAV
  ========================= -->

  <nav>

    <button class="selected">

      🔑

      <span>
        Keys
      </span>

    </button>


    <button>

      📊

      <span>
        Usage
      </span>

    </button>


    <button>

      ⚙️

      <span>
        Settings
      </span>

    </button>

  </nav>


</div>



<script src="script.js"></script>

</body>

</html>
